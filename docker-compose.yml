services:
  db:
    image: postgres:16-alpine
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: ${DB_USERNAME:-jobportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobportal} -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: jobportal-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/jobportal
      DB_USERNAME: ${DB_USERNAME:-jobportal}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FILE_UPLOAD_DIR: /app/uploads/resumes
      MAX_FILE_SIZE: 10MB
      MAX_REQUEST_SIZE: 15MB
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - resume_uploads:/app/uploads/resumes

volumes:
  postgres_data:
  resume_uploads:
